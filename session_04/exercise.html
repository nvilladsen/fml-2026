<script>
// Start Over also hides the revealed solution (and brings back "Show Solution").
(function () {
  var pending = {};
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('a, button');
    if (!btn) return;
    var cell = btn.closest('.exercise-cell');
    if (btn.classList.contains('btn-exercise-solution')) {
      var header = btn.parentElement;
      pending.parent = header; pending.className = btn.className; pending.html = btn.innerHTML;
      return;
    }
    if (btn.classList.contains('btn-outline-dark') && /Start Over/.test(btn.textContent) && cell) {
      var ex = null;
      document.querySelectorAll('.exercise-solution').forEach(function (sol) {
        if (!sol.classList.contains('d-none')) {
          sol.classList.add('d-none');
          if (pending.parent) {
            var again = document.createElement('a');
            again.className = pending.className; again.innerHTML = pending.html;
            again.setAttribute('role', 'button'); again.tabIndex = 0;
            again.onclick = function () { sol.classList.remove('d-none'); again.remove(); };
            pending.parent.prepend(again);
            pending = {};
          }
        }
      });
    }
  }, true);
})();
</script>
